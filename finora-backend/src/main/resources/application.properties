spring.application.name=finora-backend

# --- Database (PostgreSQL) ---
# Set these as environment variables before running, e.g.:
#   export DB_URL=jdbc:postgresql://localhost:5432/finora
#   export DB_USERNAME=postgres
#   export DB_PASSWORD=yourpassword
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = auto-creates/updates tables from your entities. Fine for dev,
# switch to a migration tool (Flyway/Liquibase) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# IMPORTANT: set a real secret via environment variable in production.
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-change-me-before-deploying-1234}
jwt.expiration-ms=86400000

# --- Server ---
server.port=${PORT:8080}
